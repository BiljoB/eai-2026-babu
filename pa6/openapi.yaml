openapi: 3.0.3
info:
  title: Checkout Saga API
  version: 1.0.0
  description: >-
    HTTP contract of the checkout orchestrator. A single operation, POST
    /checkout, takes a canonical order and runs four downstream calls in
    strict sequence: payment, inventory, shipping and notification. If a
    later call fails or times out, the steps that have a compensating action
    (payment and inventory) are undone in reverse order. Retries are made
    safe by a mandatory Idempotency-Key header.
  contact:
    name: Biljo Babu
    email: BabuB@student.turiba.lv
servers:
  - url: http://localhost:3000
    description: Orchestrator started locally with docker compose.
tags:
  - name: operations
    description: Service health and liveness.
  - name: checkout
    description: Order checkout and its saga orchestration.
paths:
  /health:
    get:
      operationId: getHealth
      tags: [operations]
      summary: Liveness check
      description: Returns 200 when the orchestrator process is up and serving requests.
      responses:
        "200":
          description: The orchestrator is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"
  /checkout:
    post:
      operationId: submitCheckout
      tags: [checkout]
      summary: Check out one order
      description: >-
        Runs the saga for the given order. Payment is authorised first, then
        inventory is reserved, shipping is created and the customer is
        notified. Each step starts only after the previous one succeeded.
        Any failure or timeout triggers compensation of completed steps in
        reverse order. A repeated request with the same key and the same
        body returns the first result without running the saga again.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            Caller-chosen unique key for this checkout attempt. Reusing it
            with an identical body replays the stored result; reusing it
            with a different body is rejected with 409.
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        description: >-
          The order to check out, in the canonical order format. The charged
          amount is derived from the items and the notification goes to the
          customer's email.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Order"
      responses:
        "200":
          description: All four steps succeeded and the saga is completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SagaResult"
        "400":
          description: The Idempotency-Key header is missing or the body is not a valid order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            The key was already used with a different body, or a request with
            this key is still running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: >-
            A step failed. The saga status is compensated when rollback
            succeeded, or failed when payment failed or a compensation call
            failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SagaResult"
        "504":
          description: >-
            A downstream call did not answer within the request timeout. Any
            completed steps were compensated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SagaResult"
components:
  schemas:
    HealthReport:
      type: object
      description: Liveness payload.
      required: [status]
      properties:
        status:
          type: string
          description: Always ok while the process is serving.
          enum: [ok]
    Order:
      type: object
      description: >-
        Canonical order, restated from canonical/order.schema.json. Unlike
        that schema, the items array is bounded here, and the orchestrator
        enforces the bound.
      additionalProperties: false
      required: [orderId, orderType, source, receivedAt, orderDate, customer, items, currency, status]
      properties:
        orderId:
          type: string
          description: Order identifier assigned by the source system.
          minLength: 1
        orderType:
          type: string
          description: Business type of the order.
          enum: [standard, express, b2b]
        source:
          type: string
          description: Channel whose translator produced the order.
          enum: [web, mobile, b2b]
        receivedAt:
          type: string
          format: date-time
          description: When the canonical record was produced.
        orderDate:
          type: string
          format: date-time
          description: Timestamp of the order itself, in UTC.
        customer:
          $ref: "#/components/schemas/Buyer"
        items:
          type: array
          description: >-
            Priced line items. At most 25, because a consumer checkout is a
            small basket and a hard cap keeps each saga cheap to run and retry.
          minItems: 1
          maxItems: 25
          items:
            $ref: "#/components/schemas/LineItem"
        currency:
          type: string
          description: Order-level currency code, for example EUR.
        status:
          type: string
          description: Order status when it was accepted.
          enum: [new, processing, shipped, delivered]
    Buyer:
      type: object
      description: The person placing the order.
      additionalProperties: false
      required: [name, email, address]
      properties:
        name:
          type: string
          description: Full name of the customer.
          minLength: 1
        email:
          type: string
          format: email
          description: Address that receives the completion notification.
        address:
          $ref: "#/components/schemas/PostalAddress"
    PostalAddress:
      type: object
      description: Delivery address.
      additionalProperties: false
      required: [street, city, postalCode, country]
      properties:
        street:
          type: string
          description: Street and house number.
          minLength: 1
        city:
          type: string
          description: City or town.
          minLength: 1
        postalCode:
          type: string
          description: Postal code in the local format.
          minLength: 1
        country:
          type: string
          description: Two-letter ISO 3166-1 country code.
    LineItem:
      type: object
      description: One priced product line on the order.
      additionalProperties: false
      required: [productId, productName, quantity, unitPrice, currency, taxRate]
      properties:
        productId:
          type: string
          description: Product identifier, for example PROD-1001.
          pattern: "^PROD-[0-9]+$"
        productName:
          type: string
          description: Display name of the product.
          minLength: 1
        quantity:
          type: integer
          description: Units ordered, at least one.
          minimum: 1
        unitPrice:
          type: string
          description: Price per unit as a decimal string with two fraction digits, for example "22.50".
          pattern: '^-?[0-9]+\.[0-9]{2}$'
        currency:
          type: string
          description: Currency of the unit price.
        taxRate:
          type: number
          description: Tax rate as a fraction between 0 and 1.
          minimum: 0
          maximum: 1
    SagaResult:
      type: object
      description: Outcome of one saga run, including every call that was made.
      required: [orderId, status, trace]
      properties:
        orderId:
          type: string
          description: The order id from the request.
          minLength: 1
        status:
          type: string
          description: Final state of the saga.
          enum: [completed, failed, compensated]
        code:
          type: string
          description: >-
            Reason for a non-completed saga. Either the failing downstream
            service's error code (for example payment_declined), timeout, or
            compensation_failed. Absent when the saga completed.
        trace:
          type: array
          description: >-
            Every call made, in order, compensations included. At most 6:
            four forward steps plus two compensations.
          maxItems: 6
          items:
            $ref: "#/components/schemas/TraceEntry"
    TraceEntry:
      type: object
      description: One downstream call made by the saga.
      required: [step, status, startedAt, finishedAt, durationMs]
      properties:
        step:
          type: string
          description: Which call this was, forward step or compensation.
          enum: [payment, inventory, shipping, notification, inventory_release, payment_refund]
        status:
          type: string
          description: How the call ended.
          enum: [success, failed, timeout]
        startedAt:
          type: string
          format: date-time
          description: When the call started.
        finishedAt:
          type: string
          format: date-time
          description: When the call ended.
        durationMs:
          type: integer
          description: Whole milliseconds the call took.
          minimum: 0
    ApiError:
      type: object
      description: Error body for rejected requests (validation and idempotency problems).
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code.
          enum: [validation_error, idempotency_payload_mismatch, idempotency_conflict]
        message:
          type: string
          description: Human-readable explanation for developers.
          minLength: 1